[project]
name = "mto-mcp-server"
version = "0.1.0"
description = "MCP server for MTO/SCSA reconciliation (Plant 3D piping MTOs)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2.0.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.scripts]
mto-mcp-server = "mto_mcp_server.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
